# Web app + API on Netlify's Next.js runtime. Database: Neon (Netlify DB); images: Netlify Blobs.
[build]
  # Migrations run against the direct (unpooled) Neon connection that Netlify DB provides.
  command = "DATABASE_URL=$NETLIFY_DATABASE_URL DIRECT_DATABASE_URL=$NETLIFY_DATABASE_URL_UNPOOLED npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
